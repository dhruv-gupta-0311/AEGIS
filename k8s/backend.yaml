apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: aegis
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      enableServiceLinks: false
      initContainers:
        # Kubernetes has no depends_on: block until MySQL accepts connections
        - name: wait-for-mysql
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z aegis-mysql 3306; do echo waiting for mysql; sleep 3; done"]
      containers:
        - name: backend
          image: __BACKEND_IMAGE__
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: aegis-secrets
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 12
          resources:
            requests:
              memory: "192Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: backend          # must stay "backend": nginx.conf proxies to http://backend:8000
  namespace: aegis
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
